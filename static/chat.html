<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FH Data • Mesa C-Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #001716; color: #E6E3D3; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #001716; }
    ::-webkit-scrollbar-thumb { background: #133B3A; border-radius: 9999px; }
    .fh-card {
      background: rgba(0, 36, 36, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(42, 197, 158, 0.15);
    }
    .prose-fh h1, .prose-fh h2, .prose-fh h3 { color: #FAF6E6; font-weight: 700; margin: 0.9rem 0 0.4rem; font-size: 0.95rem; }
    .prose-fh p { margin: 0.45rem 0; line-height: 1.65; }
    .prose-fh ul, .prose-fh ol { margin: 0.4rem 0 0.4rem 1.1rem; }
    .prose-fh li { margin: 0.2rem 0; }
    .prose-fh strong { color: #52E1B9; font-weight: 700; }
    .typing::after { content: '▍'; animation: blink 1s step-end infinite; color: #2AC59E; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse-mint { 0%, 100% { box-shadow: 0 0 0 0 rgba(42,197,158,0.35); } 50% { box-shadow: 0 0 0 8px rgba(42,197,158,0); } }
    .live-dot { animation: pulse-mint 1.6s infinite; }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rise { animation: rise-in 0.35s ease-out both; }
    .persona-lead { box-shadow: 0 0 0 1px var(--pcolor), 0 12px 28px color-mix(in srgb, var(--pcolor) 18%, transparent); }
  </style>
</head>
<body class="h-full min-h-screen antialiased">
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[640px] h-[220px] bg-[#2AC59E]/10 blur-[120px] pointer-events-none"></div>

  <div class="relative z-10 max-w-7xl mx-auto h-screen flex flex-col md:flex-row">
    <aside class="md:w-[22rem] shrink-0 border-b md:border-b-0 md:border-r border-[#133B3A] p-4 md:p-5 flex flex-col gap-3 max-h-[42vh] md:max-h-none overflow-y-auto">
      <div class="flex items-center justify-between gap-3">
        <a href="/" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#00382A] to-[#042F2F] border border-[#2AC59E]/40 flex items-center justify-center">
            <i data-lucide="users" class="w-5 h-5 text-[#2AC59E]"></i>
          </div>
          <div>
            <div class="text-sm font-extrabold text-[#FAF6E6] tracking-tight">MESA C-SUITE</div>
            <div class="text-[11px] text-[#CECABB]">Cinco vozes · uma base</div>
          </div>
        </a>
        <a href="/" class="text-[11px] px-2.5 py-1.5 rounded-lg border border-[#2AC59E]/30 text-[#CECABB] hover:text-[#FAF6E6]">Dashboard</a>
      </div>

      <div class="fh-card rounded-2xl p-4 space-y-2">
        <div class="flex items-center gap-2 text-xs">
          <span id="status-dot" class="w-2 h-2 rounded-full bg-[#E2B93B] live-dot"></span>
          <span id="status-text" class="text-[#CECABB]">Preparando a mesa…</span>
        </div>
        <p id="status-meta" class="text-[11px] text-[#B8C1BF] leading-relaxed">CEO, CFO, COO, CHRO e CMO respondem juntos cada pergunta.</p>
      </div>

      <div class="space-y-2 min-h-0 md:overflow-y-auto">
        <p class="text-[11px] font-bold uppercase tracking-wider text-[#2AC59E]">Quem está na sala</p>
        <div id="persona-list" class="flex md:flex-col gap-2 overflow-x-auto md:overflow-visible pb-1"></div>
      </div>

      <div class="hidden md:block space-y-2">
        <p class="text-[11px] font-bold uppercase tracking-wider text-[#2AC59E]">Pergunte à mesa</p>
        <div id="suggestions" class="flex flex-col gap-2"></div>
      </div>

      <button id="btn-clear" class="mt-auto hidden md:flex items-center gap-2 text-xs text-[#CECABB] hover:text-[#FAF6E6]">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        Nova conversa
      </button>
    </aside>

    <main class="flex-1 flex flex-col min-h-0">
      <div id="messages" class="flex-1 overflow-y-auto px-4 lg:px-8 py-5 space-y-4"></div>
      <form id="chat-form" class="p-4 lg:px-8 lg:pb-6">
        <div class="fh-card rounded-2xl p-2 flex items-end gap-2">
          <textarea id="input" rows="1" required
            placeholder="Pergunte à mesa. Cada C-level responde com a lente da cadeira…"
            class="flex-1 bg-transparent resize-none px-3 py-2.5 text-sm text-[#FAF6E6] placeholder:text-[#B8C1BF]/70 outline-none max-h-36"></textarea>
          <button id="btn-send" type="submit"
            class="shrink-0 m-1 px-3.5 py-2.5 rounded-xl bg-[#2AC59E] text-[#001716] font-bold text-sm flex items-center gap-2 hover:bg-[#52E1B9] disabled:opacity-40">
            <i data-lucide="send" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Enviar</span>
          </button>
        </div>
        <p class="text-[10px] text-[#B8C1BF] mt-2 px-1">Você vê quem está falando. A dica de cada cadeira usa a base 2021-2025.</p>
      </form>
    </main>
  </div>

  <script>
    marked.setOptions({ breaks: true });
    const SUGGESTIONS = [
      'Estamos no caminho da meta de R$ 110 milhões?',
      'Quem prende mais capital em DSO e glosa?',
      'Por que perdemos na cotação e quanto isso vale?',
      'Compare Ortopedia, Cardiologia e Cirurgia geral.',
      'Qual vendedor performa de verdade?'
    ];
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const btnSend = document.getElementById('btn-send');
    let history = [];
    let busy = false;
    let personas = [];

    SUGGESTIONS.forEach((text) => {
      const btn = document.createElement('button');
      btn.className = 'text-left text-xs leading-snug px-3 py-2 rounded-xl border border-[#133B3A] hover:border-[#2AC59E]/50 hover:bg-[#002424] text-[#E6E3D3]';
      btn.textContent = text;
      btn.onclick = () => send(text);
      document.getElementById('suggestions').appendChild(btn);
    });

    function avatar(p, size = 'w-11 h-11 text-sm') {
      return `<div class="${size} rounded-2xl flex items-center justify-center font-extrabold shrink-0 border"
        style="color:${p.color}; background:${p.soft || p.color + '22'}; border-color:${p.color}55">${p.initials}</div>`;
    }

    function renderPersonaList() {
      const host = document.getElementById('persona-list');
      host.innerHTML = personas.map(p => `
        <div class="flex items-center gap-3 rounded-2xl px-3 py-2 border border-[#133B3A] min-w-[16rem] md:min-w-0" style="background:${p.color}10">
          ${avatar(p, 'w-9 h-9 text-[11px]')}
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-[#FAF6E6]">${p.name}</span>
              <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded-full" style="color:${p.color};border:1px solid ${p.color}55">${p.role}</span>
            </div>
            <p class="text-[11px] text-[#CECABB] truncate">${p.signature}</p>
          </div>
        </div>`).join('');
    }

    function renderWelcome() {
      const cards = personas.map(p => `
        <div class="rounded-2xl p-3 border border-[#133B3A] text-left" style="background:${p.color}12">
          <div class="flex items-center gap-2 mb-2">
            ${avatar(p, 'w-8 h-8 text-[10px]')}
            <div>
              <div class="text-xs font-bold text-[#FAF6E6]">${p.name}</div>
              <div class="text-[10px] font-bold" style="color:${p.color}">${p.role} · ${p.title}</div>
            </div>
          </div>
          <p class="text-[11px] text-[#CECABB] leading-relaxed">“${p.signature}”</p>
        </div>`).join('');
      messagesEl.innerHTML = `
        <div class="fh-card rounded-3xl p-6 max-w-3xl">
          <div class="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-wide text-[#2AC59E] mb-3">
            <i data-lucide="crown" class="w-3.5 h-3.5"></i> Mesa C-Suite
          </div>
          <h1 class="text-2xl font-extrabold text-[#FAF6E6] mb-2">Cinco executivos. Uma pergunta. Cinco dicas.</h1>
          <p class="text-sm text-[#CECABB] leading-relaxed mb-4">
            Você conversa com a base e vê quem está respondendo: Helena (CEO), Eduardo (CFO), Marina (COO), Rafael (CHRO) e Beatriz (CMO).
          </p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${cards}</div>
          <div class="mt-4 flex flex-wrap gap-2 lg:hidden" id="mobile-suggestions"></div>
        </div>`;
      lucide.createIcons();
      const mobile = document.getElementById('mobile-suggestions');
      if (mobile) {
        SUGGESTIONS.forEach((text) => {
          const btn = document.createElement('button');
          btn.className = 'text-left text-[11px] px-3 py-2 rounded-xl border border-[#133B3A] text-[#E6E3D3]';
          btn.textContent = text;
          btn.onclick = () => send(text);
          mobile.appendChild(btn);
        });
      }
    }

    function addUserBubble(text) {
      const wrap = document.createElement('div');
      wrap.className = 'flex justify-end rise';
      wrap.innerHTML = `<div class="max-w-2xl rounded-2xl rounded-br-md bg-[#2AC59E] text-[#001716] px-4 py-3 text-sm font-medium">${escapeHtml(text)}</div>`;
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addPersonaCard(p, delay) {
      const wrap = document.createElement('article');
      wrap.className = `rise flex gap-3 items-start ${p.lead ? 'persona-lead rounded-3xl p-1' : ''}`;
      wrap.style.setProperty('--pcolor', p.color);
      wrap.style.animationDelay = `${delay}ms`;
      const lead = p.lead
        ? `<span class="text-[10px] font-extrabold uppercase tracking-wide px-2 py-0.5 rounded-full" style="background:${p.color};color:#001716">Leitura principal</span>`
        : `<span class="text-[10px] text-[#CECABB]">entrou na mesa</span>`;
      wrap.innerHTML = `
        ${avatar(p)}
        <div class="flex-1 min-w-0 rounded-2xl rounded-tl-md px-4 py-3 border" style="background:${p.soft || p.color + '14'}; border-color:${p.color}40">
          <div class="flex flex-wrap items-center gap-2 mb-1.5">
            <span class="text-sm font-extrabold text-[#FAF6E6]">${p.name}</span>
            <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded-full" style="color:${p.color}; border:1px solid ${p.color}66">${p.role}</span>
            <span class="text-[11px] text-[#CECABB]">${p.title}</span>
            ${lead}
          </div>
          <p class="text-[11px] italic mb-2" style="color:${p.color}">“${p.signature}”</p>
          <p class="text-sm text-[#E6E3D3] leading-relaxed">${escapeHtml(p.tip)}</p>
        </div>`;
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    function addMeta(html) {
      const wrap = document.createElement('div');
      wrap.className = 'flex flex-wrap gap-1.5 pl-14 rise';
      wrap.innerHTML = html;
      messagesEl.appendChild(wrap);
    }

    function sourceChips(sources, tools, model) {
      const chips = (sources || []).slice(0, 5).map(s =>
        `<span class="text-[10px] px-2 py-1 rounded-full border border-[#2AC59E]/25 text-[#C2EAE8]">${s.kind} · ${s.id}</span>`
      ).join('');
      const toolN = (tools || []).length;
      return `${chips}<span class="text-[10px] px-2 py-1 rounded-full border border-[#133B3A] text-[#CECABB]">${model || ''} · ${toolN} consulta${toolN === 1 ? '' : 's'}</span>`;
    }

    async function pollHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        const meta = document.getElementById('status-meta');
        if (data.ok && data.ready) {
          dot.className = 'w-2 h-2 rounded-full bg-[#2AC59E] live-dot';
          text.textContent = 'Mesa pronta';
          meta.textContent = `${data.deals} negócios · ${data.chunks} trechos · ${data.model}`;
          return true;
        }
        dot.className = 'w-2 h-2 rounded-full bg-[#E2B93B] live-dot';
        text.textContent = 'Indexando a base…';
        meta.textContent = data.index || data.error || 'Preparando as cadeiras.';
      } catch (err) {
        document.getElementById('status-text').textContent = 'Servidor offline';
      }
      return false;
    }

    async function send(text) {
      if (busy) return;
      const message = (text || input.value).trim();
      if (!message) return;
      if (history.length === 0) messagesEl.innerHTML = '';
      busy = true;
      btnSend.disabled = true;
      input.value = '';
      addUserBubble(message);
      const thinking = document.createElement('div');
      thinking.className = 'flex items-center gap-3 text-sm text-[#CECABB] pl-1';
      thinking.innerHTML = `<div class="w-11 h-11 rounded-2xl border border-[#2AC59E]/30 flex items-center justify-center"><i data-lucide="users" class="w-4 h-4 text-[#2AC59E]"></i></div><span class="typing">A mesa está lendo a base</span>`;
      messagesEl.appendChild(thinking);
      lucide.createIcons();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Falha no chat');
        thinking.remove();
        const board = data.board || [];
        const ordered = [...board.filter(p => p.lead), ...board.filter(p => !p.lead)];
        ordered.forEach((p, i) => addPersonaCard(p, i * 90));
        addMeta(sourceChips(data.sources, data.tools, data.model));
        history.push({ role: 'user', content: message });
        history.push({ role: 'assistant', content: (board.map(p => `${p.role}: ${p.tip}`).join('\n') || data.answer || '') });
      } catch (err) {
        thinking.innerHTML = `<span class="text-[#FF6568]">${escapeHtml(err.message)}</span>`;
      } finally {
        busy = false;
        btnSend.disabled = false;
        input.focus();
      }
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); send(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    document.getElementById('btn-clear').addEventListener('click', () => {
      history = [];
      renderWelcome();
    });

    fetch('/api/personas').then(r => r.json()).then((data) => {
      personas = data.personas || [];
      renderPersonaList();
      renderWelcome();
    }).catch(() => renderWelcome());

    lucide.createIcons();
    pollHealth().then((ready) => {
      if (ready) return;
      const timer = setInterval(async () => {
        if (await pollHealth()) clearInterval(timer);
      }, 2500);
    });
  </script>
</body>
</html>
